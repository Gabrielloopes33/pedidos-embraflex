services:
  - type: web
    name: backend-embraflex
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: WEBHOOK_QUOTE_SIGNED
        sync: false  # Configure no painel do Render com sua URL do n8n
      - key: WEBHOOK_QUOTE_REJECTED
        sync: false  # Opcional: webhook para orçamentos rejeitados
