[build]
  command = "npm run build"
  publish = "dist"

# Desabilitar secrets scanning para arquivos de exemplo
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = ".env.example,backend/.env.example,backend/*.sql,backend/package-lock.json,backend/src/setup-database.ts"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers para melhorar cache e segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache para assets estáticos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service Worker (se existir)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
