[build]
  command = "npm run build"
  publish = "dist"

# Configuração do secrets scanner
# As credenciais WooCommerce estão apenas no backend (servidor separado)
# O frontend não expõe secrets - apenas usa VITE_API_BASE_URL
[build.environment]
  # Desabilitar secrets scanning pois não há secrets no código do frontend
  SECRETS_SCAN_ENABLED = "false"
  # Ou alternativamente, omitir paths específicos:
  # SECRETS_SCAN_OMIT_PATHS = "backend/**,*.sql,*.env.example"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers para melhorar cache e segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache para assets estáticos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service Worker (se existir)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
